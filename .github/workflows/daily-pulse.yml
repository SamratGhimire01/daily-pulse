name: DailyPulse

# NOTE: GitHub Actions "schedule" cron triggers run on GitHub's own queue and
# are NOT guaranteed to run at the exact minute requested — under load they
# can be delayed by minutes (occasionally longer). DailyPulse is idempotent
# (it skips generation if today's file already exists), so a late or
# slightly-off-time run is safe and will never create duplicate content.
#
# Cron times below are in UTC and set to land at ~07:00 / ~12:00 / ~19:00
# Nepal time (UTC+5:45). If you're in a different timezone, recompute:
# subtract your UTC offset from your desired local time to get the UTC cron time.

on:
  schedule:
    - cron: "15 1 * * *"   # ~07:00 Nepal time -> quote
    - cron: "15 6 * * *"   # ~12:00 Nepal time -> news
    - cron: "15 13 * * *"  # ~19:00 Nepal time -> insight
  workflow_dispatch:
    inputs:
      type:
        description: "Content type to generate (quote/news/insight). Leave blank to auto-pick from the triggering schedule."
        required: false
        default: ""
      force:
        description: "Regenerate even if today's post already exists"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine content type
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.type }}" ]; then
            echo "type=${{ github.event.inputs.type }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "15 1 * * *")  echo "type=quote"   >> "$GITHUB_OUTPUT" ;;
              "15 6 * * *")  echo "type=news"    >> "$GITHUB_OUTPUT" ;;
              "15 13 * * *") echo "type=insight" >> "$GITHUB_OUTPUT" ;;
              *)             echo "type=quote"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Configure git identity
        run: |
          git config user.name "Samrat Ghimire"
          git config user.email "108140934+SamratGhimire01@users.noreply.github.com"

      - name: Generate and push content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # No .env file exists on this runner (it's git-ignored), so the app's
          # own settings loader would otherwise fall back to its default bot
          # identity here and silently override the step above. Passing these
          # explicitly keeps both steps in agreement.
          GIT_AUTHOR_NAME: "Samrat Ghimire"
          GIT_AUTHOR_EMAIL: "108140934+SamratGhimire01@users.noreply.github.com"
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m src.main --type "${{ steps.pick.outputs.type }}" $FORCE_FLAG