name: DailyPulse

# NOTE: GitHub Actions "schedule" cron triggers run on GitHub's own queue and
# are NOT guaranteed to run at the exact minute requested — under load they
# can be delayed by minutes (occasionally longer). DailyPulse is idempotent
# (it skips generation if today's file already exists), so a late or
# slightly-off-time run is safe and will never create duplicate content.
#
# Cron below targets each window's start time in UTC. Adjust for your
# timezone, or add a random `sleep` step below if you want jitter similar
# to the local scheduler.

on:
  schedule:
    - cron: "0 7 * * *"   # ~morning window start (UTC)
    - cron: "0 12 * * *"  # ~afternoon window start (UTC)
    - cron: "0 19 * * *"  # ~evening window start (UTC)
  workflow_dispatch:
    inputs:
      type:
        description: "Content type to generate (quote/news/insight). Leave blank to auto-pick by current UTC hour."
        required: false
        default: ""
      force:
        description: "Regenerate even if today's post already exists"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine content type
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.type }}" ]; then
            echo "type=${{ github.event.inputs.type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 10 ]; then
              echo "type=quote" >> "$GITHUB_OUTPUT"
            elif [ "$HOUR" -lt 16 ]; then
              echo "type=news" >> "$GITHUB_OUTPUT"
            else
              echo "type=insight" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure git identity
        run: |
          git config user.name "Samrat Ghimire"
          git config user.email "108140934+SamratGhimire01@users.noreply.github.com"

      - name: Generate and push content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m src.main --type "${{ steps.pick.outputs.type }}" $FORCE_FLAG
